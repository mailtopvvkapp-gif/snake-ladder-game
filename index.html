<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snakes and Ladders</title>
  <style>
    :root {
      --bg-color: #381a30;
      --panel-bg: #220f1e;
      --accent: #caa0e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 520px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px 8px 6px;
      overflow: hidden;
    }

    /* Compact Top Header */
    .top-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      z-index: 5;
    }

    .theme-bar {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px 6px;
      border-radius: 12px;
    }

    .theme-btn {
      border: 1.5px solid transparent;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .theme-btn.active {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.4);
    }

    .action-btn {
      border: none;
      background: #c23b3b;
      color: white;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Player Status Ribbon */
    .players-ribbon {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 2px 0;
      z-index: 5;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 11px;
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .player-card.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.25);
      transform: scale(1.05);
    }

    .player-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #fff;
    }

    /* Max-Zoomed Board Area */
    .board-container {
      position: relative;
      width: 98vw;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      max-height: calc(100vh - 120px);
      background: #000;
      border-radius: 8px;
      border: 3px solid #111;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Compact Bottom Control Bar */
    .controls-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #140a12;
      border-radius: 16px;
      padding: 6px 12px;
      border: 2px solid #000;
      z-index: 5;
    }

    .turn-text {
      color: #fff;
      font-size: 13px;
      font-weight: 900;
    }

    .turn-text span {
      display: block;
      font-size: 10px;
      color: #aaa;
      font-weight: normal;
    }

    .roll-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dice {
      width: 44px;
      height: 44px;
      background: #fff;
      border-radius: 10px;
      border: 3px solid #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: 900;
      color: #111;
      box-shadow: 0 3px 0 #999;
      cursor: pointer;
    }

    .dice.rolling {
      animation: diceShake 0.12s infinite alternate;
    }

    @keyframes diceShake {
      0% { transform: rotate(-12deg) scale(1.1); }
      100% { transform: rotate(12deg) scale(1.1); }
    }

    .main-roll-btn {
      background: #8e8fa3;
      color: #241b35;
      border: 3px solid #111;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #4a4a58;
    }

    .main-roll-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4a4a58;
    }

    .main-roll-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal dialogs */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .modal-card {
      background: #381f33;
      border: 3px solid #caa0e2;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      width: 85%;
      max-width: 300px;
      color: white;
    }

    .modal-card h2 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .modal-card p {
      font-size: 12px;
      color: #ddd;
      margin-bottom: 14px;
    }

    .option-btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      background: #caa0e2;
      color: #2b1126;
      border: 2px solid #fff;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-screen">
    <!-- Top Header -->
    <div class="top-header">
      <div class="theme-bar">
        <button class="theme-btn active" onclick="setSkin('purple')">Purple</button>
        <button class="theme-btn" onclick="setSkin('classic')">Classic</button>
        <button class="theme-btn" onclick="setSkin('emerald')">Emerald</button>
        <button class="theme-btn" onclick="setSkin('midnight')">Midnight</button>
      </div>
      <button class="action-btn" onclick="openPlayerSelect()">New Game</button>
    </div>

    <!-- Active Players Status Ribbon -->
    <div class="players-ribbon" id="playersRibbon"></div>

    <!-- Maximized Canvas Board -->
    <div class="board-container">
      <canvas id="gameBoard" width="1000" height="1000"></canvas>
    </div>

    <!-- Bottom Action Controls -->
    <div class="controls-panel">
      <div class="turn-text" id="turnIndicator">
        Player 1's Turn
        <span id="turnSubText">Tap roll to move</span>
      </div>
      <div class="roll-container">
        <div class="dice" id="diceElement" onclick="handleTurnRoll()">⚀</div>
        <button class="main-roll-btn" id="rollBtn" onclick="handleTurnRoll()">ROLL</button>
      </div>
    </div>

    <!-- Player Selection Modal -->
    <div class="modal-overlay" id="setupModal">
      <div class="modal-card">
        <h2>Snakes & Ladders</h2>
        <p>Select player mode</p>
        <button class="option-btn" onclick="startGame(1)">1 Player vs Bot 🤖</button>
        <button class="option-btn" onclick="startGame(2)">2 Players</button>
        <button class="option-btn" onclick="startGame(3)">3 Players</button>
        <button class="option-btn" onclick="startGame(4)">4 Players</button>
      </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay" id="winModal" style="display: none;">
      <div class="modal-card">
        <h2 id="winnerText">🏆 Player 1 Wins!</h2>
        <p>Reached Tile 100!</p>
        <button class="option-btn" onclick="openPlayerSelect()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    // --- Web Audio Synthesized Sound Engine (No External Assets Needed) ---
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDiceRattleSound() {
      try {
        const ctx = getAudioContext();
        const bufferSize = ctx.sampleRate * 0.05;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 900 + Math.random() * 600;
        filter.Q.value = 4;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function playStepSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

    // --- Game Logic and Graphics Engine ---
    const canvas = document.getElementById('gameBoard');
    const ctx = canvas.getContext('2d');
    const size = 1000;
    const cellSize = size / 10;
    const diceChars = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    const SKINS = {
      purple: {
        bodyBg: '#381a30', panelBg: '#220f1e',
        tileA: '#473166', tileB: '#8e8fa3',
        textA: '#ffffff', textB: '#241b35',
        ladderWood: '#8f5c35', ladderBorder: '#4a2c13',
        rollBtnBg: '#8e8fa3', rollBtnText: '#241b35'
      },
      classic: {
        bodyBg: '#2b5f6e', panelBg: '#1e434f',
        tileA: '#f2af69', tileB: '#fff6e5',
        textA: '#b26829', textB: '#b26829',
        ladderWood: '#9e623a', ladderBorder: '#5b2f15',
        rollBtnBg: '#59d2fe', rollBtnText: '#ffffff'
      },
      emerald: {
        bodyBg: '#133529', panelBg: '#0d241c',
        tileA: '#275d4a', tileB: '#d8eedd',
        textA: '#ffffff', textB: '#1a4334',
        ladderWood: '#7c5332', ladderBorder: '#422a16',
        rollBtnBg: '#a3d9a5', rollBtnText: '#133529'
      },
      midnight: {
        bodyBg: '#0f111c', panelBg: '#181b2b',
        tileA: '#2a2f52', tileB: '#4c5382',
        textA: '#00f0ff', textB: '#ffffff',
        ladderWood: '#494268', ladderBorder: '#1c1830',
        rollBtnBg: '#6c7ab8', rollBtnText: '#131627'
      }
    };
    let activeSkin = SKINS.purple;

    // Exact reference ladders: [start, end]
    const ladders = [
      [2, 23], [8, 34], [28, 77], [39, 44],
      [45, 66], [71, 91], [68, 89], [82, 100]
    ];

    // Reference organic snakes with multi-curved spline bodies
    const snakes = [
      { head: 97, tail: 57, color: '#e84118', belly: '#fbc531', cp: [[-45, 50], [70, 130], [-60, 220]] },
      { head: 95, tail: 75, color: '#44bd32', belly: '#a3cb38', cp: [[35, 25], [-25, 65]] },
      { head: 93, tail: 73, color: '#e1b12c', belly: '#f5cd79', cp: [[-35, 35], [25, 75]] },
      { head: 89, tail: 70, color: '#00a8ff', belly: '#70a1ff', cp: [[35, 45], [-35, 85]] },
      { head: 60, tail: 19, color: '#e1b12c', belly: '#f5cd79', cp: [[-65, 70], [75, 170], [-45, 250]] },
      { head: 56, tail: 46, color: '#44bd32', belly: '#a3cb38', cp: [[35, 20], [-25, 45]] },
      { head: 49, tail: 33, color: '#e84118', belly: '#fbc531', cp: [[-35, 35], [35, 65]] },
      { head: 36, tail: 18, color: '#00cec9', belly: '#81ecec', cp: [[-45, 45], [35, 85]] },
      { head: 14, tail: 5,  color: '#9c88ff', belly: '#dcdde1', cp: [[-35, 25], [25, 45]] }
    ];

    const PLAYER_COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
    let players = [];
    let currentPlayerIndex = 0;
    let isMoving = false;
    let vsBot = false;

    function setSkin(skinKey) {
      if (!SKINS[skinKey]) return;
      activeSkin = SKINS[skinKey];
      document.documentElement.style.setProperty('--bg-color', activeSkin.bodyBg);
      document.documentElement.style.setProperty('--panel-bg', activeSkin.panelBg);
      const rollBtn = document.getElementById('rollBtn');
      rollBtn.style.background = activeSkin.rollBtnBg;
      rollBtn.style.color = activeSkin.rollBtnText;

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === skinKey);
      });
      render();
    }

    function openPlayerSelect() {
      document.getElementById('winModal').style.display = 'none';
      document.getElementById('setupModal').style.display = 'flex';
    }

    function startGame(count) {
      document.getElementById('setupModal').style.display = 'none';
      document.getElementById('winModal').style.display = 'none';

      vsBot = (count === 1);
      const totalPlayers = vsBot ? 2 : count;
      players = [];

      for (let i = 0; i < totalPlayers; i++) {
        players.push({
          id: i,
          name: vsBot && i === 1 ? 'Bot 🤖' : `Player ${i + 1}`,
          color: PLAYER_COLORS[i],
          pos: 1,
          isBot: vsBot && i === 1
        });
      }

      currentPlayerIndex = 0;
      updatePlayersUI();
      render();
    }

    function updatePlayersUI() {
      const ribbon = document.getElementById('playersRibbon');
      ribbon.innerHTML = '';

      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === currentPlayerIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="player-dot" style="background: ${p.color}"></div>
          <span>${p.name} (T:${p.pos})</span>
        `;
        ribbon.appendChild(card);
      });

      const current = players[currentPlayerIndex];
      document.getElementById('turnIndicator').innerHTML = `
        ${current.name}'s Turn
        <span>${current.isBot ? 'Thinking...' : 'Tap roll to move'}</span>
      `;
    }

    function getCellCoords(num) {
      const clamped = Math.max(1, Math.min(100, num));
      const idx = clamped - 1;
      const rowFromBottom = Math.floor(idx / 10);
      const col = idx % 10;
      const actualCol = (rowFromBottom % 2 === 0) ? col : (9 - col);
      const actualRow = 9 - rowFromBottom;
      return {
        x: actualCol * cellSize + cellSize / 2,
        y: actualRow * cellSize + cellSize / 2
      };
    }

    function drawGrid() {
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const isA = (r + c) % 2 === 0;
          ctx.fillStyle = isA ? activeSkin.tileA : activeSkin.tileB;
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);

          const rowFromBottom = 9 - r;
          const num = (rowFromBottom % 2 === 0)
            ? (rowFromBottom * 10 + c + 1)
            : (rowFromBottom * 10 + (9 - c) + 1);

          ctx.font = 'bold 24px sans-serif';
          ctx.fillStyle = isA ? activeSkin.textA : activeSkin.textB;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          ctx.fillText(num, (c + 1) * cellSize - 6, r * cellSize + 6);
        }
      }
    }

    function drawLadders() {
      ladders.forEach(([start, end]) => {
        const p1 = getCellCoords(start);
        const p2 = getCellCoords(end);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const angle = Math.atan2(dy, dx);
        const len = Math.hypot(dx, dy);

        ctx.save();
        ctx.translate(p1.x, p1.y);
        ctx.rotate(angle);

        ctx.strokeStyle = activeSkin.ladderBorder;
        ctx.fillStyle = activeSkin.ladderWood;
        ctx.lineWidth = 4;

        ctx.fillRect(0, -15, len, 7);
        ctx.strokeRect(0, -15, len, 7);
        ctx.fillRect(0, 8, len, 7);
        ctx.strokeRect(0, 8, len, 7);

        const steps = Math.max(3, Math.floor(len / 24));
        for (let i = 1; i < steps; i++) {
          const x = (len / steps) * i;
          ctx.fillRect(x - 3, -15, 7, 30);
          ctx.strokeRect(x - 3, -15, 7, 30);
        }
        ctx.restore();
      });
    }

    function drawSnakes() {
      snakes.forEach(s => {
        const head = getCellCoords(s.head);
        const tail = getCellCoords(s.tail);

        const points = [head];
        const segs = s.cp.length + 1;
        s.cp.forEach((offset, i) => {
          const t = (i + 1) / segs;
          points.push({
            x: head.x + (tail.x - head.x) * t + offset[0],
            y: head.y + (tail.y - head.y) * t + offset[1]
          });
        });
        points.push(tail);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.lineTo(tail.x, tail.y);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 22;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.strokeStyle = '#111';
        ctx.lineWidth = 18;
        ctx.stroke();

        ctx.strokeStyle = s.color;
        ctx.lineWidth = 13;
        ctx.stroke();

        ctx.strokeStyle = s.belly;
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.restore();

        // Cartoon Snake Head
        ctx.save();
        ctx.translate(head.x, head.y);
        
        // Tongue
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.lineTo(0, -17);
        ctx.lineTo(-4, -21);
        ctx.moveTo(0, -17);
        ctx.lineTo(4, -21);
        ctx.stroke();

        // Head shape
        ctx.fillStyle = s.color;
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-5, -4, 5, 0, Math.PI * 2);
        ctx.arc(5, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Pupils
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-5, -4, 2.5, 0, Math.PI * 2);
        ctx.arc(5, -4, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawPawns() {
      const tileOccupants = {};
      players.forEach(p => {
        if (!tileOccupants[p.pos]) tileOccupants[p.pos] = [];
        tileOccupants[p.pos].push(p);
      });

      Object.keys(tileOccupants).forEach(tile => {
        const group = tileOccupants[tile];
        const center = getCellCoords(Number(tile));

        group.forEach((p, idx) => {
          const total = group.length;
          const angle = (idx / total) * Math.PI * 2;
          const radius = total > 1 ? 16 : 0;
          const x = center.x + Math.cos(angle) * radius;
          const y = center.y + Math.sin(angle) * radius;

          ctx.save();
          ctx.translate(x, y);

          ctx.fillStyle = 'rgba(0,0,0,0.45)';
          ctx.beginPath();
          ctx.ellipse(0, 10, 14, 6, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = p.color;
          ctx.strokeStyle = '#111';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-11, 10);
          ctx.lineTo(-5, -5);
          ctx.lineTo(5, -5);
          ctx.lineTo(11, 10);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, -10, 9, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(3, -12, 3, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });
      });
    }

    function render() {
      ctx.clearRect(0, 0, size, size);
      drawGrid();
      drawLadders();
      drawSnakes();
      drawPawns();
    }

    async function handleTurnRoll() {
      if (isMoving || players.length === 0) return;
      const current = players[currentPlayerIndex];

      isMoving = true;
      document.getElementById('rollBtn').disabled = true;

      const diceElem = document.getElementById('diceElement');
      diceElem.classList.add('rolling');

      // Play synthesized audio dice sound effect on every shake step
      let roll = 1;
      for (let i = 0; i < 10; i++) {
        roll = Math.floor(Math.random() * 6) + 1;
        diceElem.textContent = diceChars[roll];
        playDiceRattleSound();
        await new Promise(r => setTimeout(r, 60));
      }
      diceElem.classList.remove('rolling');

      // Move player token step-by-step
      const targetPos = Math.min(100, current.pos + roll);
      while (current.pos < targetPos) {
        current.pos++;
        playStepSound();
        render();
        updatePlayersUI();
        await new Promise(r => setTimeout(r, 160));
      }

      // Check ladder climb
      for (const [start, end] of ladders) {
        if (current.pos === start) {
          await new Promise(r => setTimeout(r, 200));
          current.pos = end;
          playStepSound();
          render();
          updatePlayersUI();
          break;
        }
      }

      // Check snake bite
      for (const s of snakes) {
        if (current.pos === s.head) {
          await new Promise(r => setTimeout(r, 200));
          current.pos = s.tail;
          playStepSound();
          render();
          updatePlayersUI();
          break;
        }
      }

      // Check Winner
      if (current.pos === 100) {
        document.getElementById('winnerText').textContent = `🏆 ${current.name} Wins!`;
        document.getElementById('winModal').style.display = 'flex';
        isMoving = false;
        return;
      }

      // Next Player Turn
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updatePlayersUI();
      isMoving = false;
      document.getElementById('rollBtn').disabled = false;

      // Bot Automated Turn
      if (players[currentPlayerIndex].isBot) {
        setTimeout(handleTurnRoll, 650);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setSkin('purple');
      openPlayerSelect();
    });
  </script>
</body>
</html>
