<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snakes and Ladders</title>
  <style>
    :root {
      --bg-color: #3b1d33;
      --panel-bg: #271322;
      --accent: #caa0e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-screen {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 960px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
    }

    /* Header Bar */
    .top-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .theme-bar {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 6px;
      border-radius: 12px;
    }

    .theme-btn {
      border: 2px solid transparent;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .theme-btn.active {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.4);
    }

    .reset-btn {
      border: none;
      background: #c23b3b;
      color: white;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Player Status Ribbon */
    .players-ribbon {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 14px;
      padding: 6px 4px;
      margin: 4px 0;
      z-index: 2;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 12px;
      transition: all 0.25s ease;
      border: 2px solid transparent;
    }

    .player-card.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.25);
      transform: scale(1.06);
    }

    .player-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.5px solid #fff;
    }

    /* Board Area */
    .board-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: calc(100vh - 190px);
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 4px solid #111;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Bottom Controller Area */
    .controls-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #180c16;
      border-radius: 20px;
      padding: 8px 14px;
      border: 3px solid #000;
      margin-top: 4px;
      z-index: 2;
    }

    .turn-text {
      color: #fff;
      font-size: 13px;
      font-weight: bold;
    }

    .turn-text span {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }

    .roll-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dice {
      width: 48px;
      height: 48px;
      background: #fff;
      border-radius: 10px;
      border: 3px solid #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      color: #111;
      box-shadow: 0 4px 0 #999;
      transition: transform 0.15s ease;
    }

    .dice.rolling {
      animation: shake 0.35s infinite linear;
    }

    @keyframes shake {
      0% { transform: rotate(0deg) scale(1.1); }
      25% { transform: rotate(15deg) scale(1.1); }
      75% { transform: rotate(-15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1.1); }
    }

    .main-roll-btn {
      background: #8e8fa3;
      color: #241b35;
      border: 3px solid #111;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 #4a4a58;
    }

    .main-roll-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4a4a58;
    }

    .main-roll-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal / Popups */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-card {
      background: #381f33;
      border: 4px solid #caa0e2;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      color: white;
    }

    .modal-card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .modal-card p {
      font-size: 13px;
      color: #ddd;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #caa0e2;
      color: #2b1126;
      border: 2px solid #fff;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-screen">
    <!-- Top Header -->
    <div class="top-header">
      <div class="theme-bar">
        <button class="theme-btn active" onclick="setSkin('purple')">Purple</button>
        <button class="theme-btn" onclick="setSkin('classic')">Classic</button>
        <button class="theme-btn" onclick="setSkin('emerald')">Emerald</button>
        <button class="theme-btn" onclick="setSkin('midnight')">Midnight</button>
      </div>
      <button class="reset-btn" onclick="openPlayerSelect()">New Game</button>
    </div>

    <!-- Active Players Status Ribbon -->
    <div class="players-ribbon" id="playersRibbon"></div>

    <!-- Scaled Canvas Board Area -->
    <div class="board-container">
      <canvas id="gameBoard" width="1000" height="1000"></canvas>
    </div>

    <!-- Bottom Action Controls -->
    <div class="controls-panel">
      <div class="turn-text" id="turnIndicator">
        Player 1's Turn
        <span id="turnSubText">Tap roll to move</span>
      </div>
      <div class="roll-container">
        <div class="dice" id="diceElement">⚀</div>
        <button class="main-roll-btn" id="rollBtn" onclick="handleTurnRoll()">ROLL</button>
      </div>
    </div>

    <!-- Player Setup Modal -->
    <div class="modal-overlay" id="setupModal">
      <div class="modal-card">
        <h2>Snakes & Ladders</h2>
        <p>Choose your match mode to start</p>
        <button class="option-btn" onclick="startGame(1)">1 Player (vs Computer)</button>
        <button class="option-btn" onclick="startGame(2)">2 Players</button>
        <button class="option-btn" onclick="startGame(3)">3 Players</button>
        <button class="option-btn" onclick="startGame(4)">4 Players</button>
      </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal-overlay" id="winModal" style="display: none;">
      <div class="modal-card">
        <h2 id="winnerText">🏆 Player Wins!</h2>
        <p>Congratulations on reaching tile 100!</p>
        <button class="option-btn" onclick="openPlayerSelect()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameBoard');
    const ctx = canvas.getContext('2d');
    const size = 1000;
    const cellSize = size / 10;
    const diceChars = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    // Themes
    const SKINS = {
      purple: {
        bodyBg: '#3b1d33', panelBg: '#271322',
        tileA: '#473166', tileB: '#8e8fa3',
        textA: '#ffffff', textB: '#241b35',
        ladderWood: '#8f5c35', ladderBorder: '#4a2c13',
        rollBtnBg: '#8e8fa3', rollBtnText: '#241b35'
      },
      classic: {
        bodyBg: '#2b5f6e', panelBg: '#1e434f',
        tileA: '#f2af69', tileB: '#fff6e5',
        textA: '#b26829', textB: '#b26829',
        ladderWood: '#9e623a', ladderBorder: '#5b2f15',
        rollBtnBg: '#59d2fe', rollBtnText: '#ffffff'
      },
      emerald: {
        bodyBg: '#133529', panelBg: '#0d241c',
        tileA: '#275d4a', tileB: '#d8eedd',
        textA: '#ffffff', textB: '#1a4334',
        ladderWood: '#7c5332', ladderBorder: '#422a16',
        rollBtnBg: '#a3d9a5', rollBtnText: '#133529'
      },
      midnight: {
        bodyBg: '#0f111c', panelBg: '#181b2b',
        tileA: '#2a2f52', tileB: '#4c5382',
        textA: '#00f0ff', textB: '#ffffff',
        ladderWood: '#494268', ladderBorder: '#1c1830',
        rollBtnBg: '#6c7ab8', rollBtnText: '#131627'
      }
    };
    let activeSkin = SKINS.purple;

    // Ladders: [Start, End]
    const ladders = [
      [2, 23], [8, 34], [28, 77], [39, 43],
      [45, 66], [71, 91], [68, 89], [82, 100]
    ];

    // Natural Snakes with multi-curve spines [Head, Tail, Color, SecondaryColor, [ControlPoints]]
    const snakes = [
      { head: 97, tail: 57, color: '#d33b3b', belly: '#f79393', cp: [[-40, 40], [60, 120], [-50, 200]] },
      { head: 95, tail: 75, color: '#2d8a43', belly: '#98dfa6', cp: [[30, 20], [-20, 60]] },
      { head: 93, tail: 73, color: '#c9962a', belly: '#fbe29a', cp: [[-30, 30], [20, 70]] },
      { head: 88, tail: 70, color: '#20968b', belly: '#8ee0d8', cp: [[30, 40], [-30, 80]] },
      { head: 62, tail: 19, color: '#c9962a', belly: '#fbe29a', cp: [[-60, 60], [70, 160], [-40, 240]] },
      { head: 56, tail: 48, color: '#20968b', belly: '#8ee0d8', cp: [[30, 20], [-20, 40]] },
      { head: 49, tail: 33, color: '#d33b3b', belly: '#f79393', cp: [[-30, 30], [30, 60]] },
      { head: 36, tail: 17, color: '#2b8fa3', belly: '#9fe5f4', cp: [[-40, 40], [30, 80]] },
      { head: 14, tail: 5,  color: '#934cb3', belly: '#e0b2f4', cp: [[-30, 20], [20, 40]] }
    ];

    const PLAYER_COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
    let players = [];
    let currentPlayerIndex = 0;
    let isMoving = false;
    let vsBot = false;

    function setSkin(skinKey) {
      if (!SKINS[skinKey]) return;
      activeSkin = SKINS[skinKey];
      document.documentElement.style.setProperty('--bg-color', activeSkin.bodyBg);
      document.documentElement.style.setProperty('--panel-bg', activeSkin.panelBg);
      const rollBtn = document.getElementById('rollBtn');
      rollBtn.style.background = activeSkin.rollBtnBg;
      rollBtn.style.color = activeSkin.rollBtnText;

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === skinKey);
      });
      render();
    }

    function openPlayerSelect() {
      document.getElementById('winModal').style.display = 'none';
      document.getElementById('setupModal').style.display = 'flex';
    }

    function startGame(count) {
      document.getElementById('setupModal').style.display = 'none';
      document.getElementById('winModal').style.display = 'none';
      
      vsBot = (count === 1);
      const totalPlayers = vsBot ? 2 : count;
      players = [];

      for (let i = 0; i < totalPlayers; i++) {
        players.push({
          id: i,
          name: vsBot && i === 1 ? 'Bot 🤖' : `Player ${i + 1}`,
          color: PLAYER_COLORS[i],
          pos: 1,
          isBot: vsBot && i === 1
        });
      }

      currentPlayerIndex = 0;
      updatePlayersUI();
      render();
    }

    function updatePlayersUI() {
      const ribbon = document.getElementById('playersRibbon');
      ribbon.innerHTML = '';

      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === currentPlayerIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="player-dot" style="background: ${p.color}"></div>
          <span>${p.name} (T:${p.pos})</span>
        `;
        ribbon.appendChild(card);
      });

      const current = players[currentPlayerIndex];
      document.getElementById('turnIndicator').innerHTML = `
        ${current.name}'s Turn
        <span>${current.isBot ? 'Thinking...' : 'Tap roll to move'}</span>
      `;
    }

    function getCellCoords(num) {
      const clamped = Math.max(1, Math.min(100, num));
      const idx = clamped - 1;
      const rowFromBottom = Math.floor(idx / 10);
      const col = idx % 10;
      const actualCol = (rowFromBottom % 2 === 0) ? col : (9 - col);
      const actualRow = 9 - rowFromBottom;
      return {
        x: actualCol * cellSize + cellSize / 2,
        y: actualRow * cellSize + cellSize / 2
      };
    }

    // Grid rendering
    function drawGrid() {
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const isA = (r + c) % 2 === 0;
          ctx.fillStyle = isA ? activeSkin.tileA : activeSkin.tileB;
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);

          const rowFromBottom = 9 - r;
          const num = (rowFromBottom % 2 === 0)
            ? (rowFromBottom * 10 + c + 1)
            : (rowFromBottom * 10 + (9 - c) + 1);

          ctx.font = 'bold 22px Arial';
          ctx.fillStyle = isA ? activeSkin.textA : activeSkin.textB;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          ctx.fillText(num, (c + 1) * cellSize - 6, r * cellSize + 6);
        }
      }
    }

    // Organic Ladders
    function drawLadders() {
      ladders.forEach(([start, end]) => {
        const p1 = getCellCoords(start);
        const p2 = getCellCoords(end);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const angle = Math.atan2(dy, dx);
        const len = Math.hypot(dx, dy);

        ctx.save();
        ctx.translate(p1.x, p1.y);
        ctx.rotate(angle);

        ctx.strokeStyle = activeSkin.ladderBorder;
        ctx.fillStyle = activeSkin.ladderWood;
        ctx.lineWidth = 4;

        // Ladder rails
        ctx.fillRect(0, -14, len, 6);
        ctx.strokeRect(0, -14, len, 6);
        ctx.fillRect(0, 8, len, 6);
        ctx.strokeRect(0, 8, len, 6);

        // Steps
        const steps = Math.max(3, Math.floor(len / 22));
        for (let i = 1; i < steps; i++) {
          const x = (len / steps) * i;
          ctx.fillRect(x - 3, -14, 6, 28);
          ctx.strokeRect(x - 3, -14, 6, 28);
        }
        ctx.restore();
      });
    }

    // Natural Organic Snakes
    function drawSnakes() {
      snakes.forEach(s => {
        const head = getCellCoords(s.head);
        const tail = getCellCoords(s.tail);

        // Calculate spline curve points
        const points = [head];
        const segs = s.cp.length + 1;
        s.cp.forEach((offset, i) => {
          const t = (i + 1) / segs;
          points.push({
            x: head.x + (tail.x - head.x) * t + offset[0],
            y: head.y + (tail.y - head.y) * t + offset[1]
          });
        });
        points.push(tail);

        // Draw shadow
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.lineTo(tail.x, tail.y);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Outer skin
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 16;
        ctx.stroke();

        // Main body
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 11;
        ctx.stroke();

        // Belly stripe pattern
        ctx.strokeStyle = s.belly;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();

        // Snake Head
        ctx.save();
        ctx.translate(head.x, head.y);
        
        // Tongue
        ctx.strokeStyle = '#d63031';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, -8);
        ctx.lineTo(0, -16);
        ctx.lineTo(-4, -20);
        ctx.moveTo(0, -16);
        ctx.lineTo(4, -20);
        ctx.stroke();

        // Head Base
        ctx.fillStyle = s.color;
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Expressive Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-5, -3, 4.5, 0, Math.PI * 2);
        ctx.arc(5, -3, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Pupils
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-5, -3, 2, 0, Math.PI * 2);
        ctx.arc(5, -3, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // Pawn Tokens
    function drawPawns() {
      // Group players sharing the same square to offset them
      const tileOccupants = {};
      players.forEach(p => {
        if (!tileOccupants[p.pos]) tileOccupants[p.pos] = [];
        tileOccupants[p.pos].push(p);
      });

      Object.keys(tileOccupants).forEach(tile => {
        const group = tileOccupants[tile];
        const center = getCellCoords(Number(tile));

        group.forEach((p, idx) => {
          const total = group.length;
          const angle = (idx / total) * Math.PI * 2;
          const radius = total > 1 ? 16 : 0;
          const x = center.x + Math.cos(angle) * radius;
          const y = center.y + Math.sin(angle) * radius;

          ctx.save();
          ctx.translate(x, y);

          // Pawn Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.beginPath();
          ctx.ellipse(0, 10, 12, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          // Body
          ctx.fillStyle = p.color;
          ctx.strokeStyle = '#111';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(-10, 10);
          ctx.lineTo(-5, -4);
          ctx.lineTo(5, -4);
          ctx.lineTo(10, 10);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Head
          ctx.beginPath();
          ctx.arc(0, -9, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Inner pin highlight
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(2, -11, 2.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });
      });
    }

    function render() {
      ctx.clearRect(0, 0, size, size);
      drawGrid();
      drawLadders();
      drawSnakes();
      drawPawns();
    }

    // Turn & Roll Logic
    async function handleTurnRoll() {
      if (isMoving || players.length === 0) return;
      const current = players[currentPlayerIndex];

      isMoving = true;
      document.getElementById('rollBtn').disabled = true;

      // Dice animation
      const diceElem = document.getElementById('diceElement');
      diceElem.classList.add('rolling');

      let roll = 1;
      for (let i = 0; i < 8; i++) {
        roll = Math.floor(Math.random() * 6) + 1;
        diceElem.textContent = diceChars[roll];
        await new Promise(r => setTimeout(r, 60));
      }
      diceElem.classList.remove('rolling');

      // Move player step-by-step
      const targetPos = Math.min(100, current.pos + roll);
      while (current.pos < targetPos) {
        current.pos++;
        render();
        updatePlayersUI();
        await new Promise(r => setTimeout(r, 180));
      }

      // Check Ladders
      for (const [start, end] of ladders) {
        if (current.pos === start) {
          await new Promise(r => setTimeout(r, 200));
          current.pos = end;
          render();
          updatePlayersUI();
          break;
        }
      }

      // Check Snakes
      for (const s of snakes) {
        if (current.pos === s.head) {
          await new Promise(r => setTimeout(r, 200));
          current.pos = s.tail;
          render();
          updatePlayersUI();
          break;
        }
      }

      // Check Win
      if (current.pos === 100) {
        document.getElementById('winnerText').textContent = `🏆 ${current.name} Wins!`;
        document.getElementById('winModal').style.display = 'flex';
        isMoving = false;
        return;
      }

      // Next Player
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updatePlayersUI();
      isMoving = false;
      document.getElementById('rollBtn').disabled = false;

      // Automated Bot Turn
      if (players[currentPlayerIndex].isBot) {
        setTimeout(handleTurnRoll, 700);
      }
    }

    // Initialize game
    window.addEventListener('DOMContentLoaded', () => {
      setSkin('purple');
      openPlayerSelect();
    });
  </script>
</body>
</html>
