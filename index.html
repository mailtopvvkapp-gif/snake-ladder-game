<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snakes and Ladders</title>
  <style>
    :root {
      --bg-color: #35182e;
      --panel-bg: #1f0d1b;
      --accent: #caa0e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 540px;
      background: var(--panel-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 6px 4px;
      overflow: hidden;
    }

    /* Minimal Compact Header */
    .top-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px;
      z-index: 5;
    }

    .theme-bar {
      display: flex;
      gap: 3px;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 4px;
      border-radius: 10px;
    }

    .theme-btn {
      border: 1px solid transparent;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 900;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }

    .theme-btn.active {
      border-color: #fff;
      background: rgba(255, 255, 255, 0.45);
    }

    .action-btn {
      border: none;
      background: #c23b3b;
      color: white;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Player Status Ribbon */
    .players-ribbon {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 1px 0;
      z-index: 5;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 10px;
      border: 1.5px solid transparent;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .player-card.active {
      border-color: #ffd700;
      background: rgba(255, 215, 0, 0.25);
      transform: scale(1.05);
    }

    .player-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid #fff;
    }

    /* Edge-to-Edge Maximized Board Area */
    .board-container {
      position: relative;
      width: 99vw;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      max-height: calc(100vh - 105px);
      background: #000;
      border-radius: 6px;
      border: 3px solid #111;
      box-shadow: 0 4px 24px rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Reaction Badge (Happy Player / Laughing Snake) */
    .reaction-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: rgba(15, 10, 20, 0.92);
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 12px 24px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 15;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      opacity: 0;
    }

    .reaction-badge.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .reaction-icon {
      font-size: 42px;
      line-height: 1;
    }

    .reaction-text {
      font-size: 15px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Controls Panel */
    .controls-panel {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #140812;
      border-radius: 12px;
      padding: 4px 10px;
      border: 2px solid #000;
      z-index: 5;
    }

    .turn-text {
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    .turn-text span {
      display: block;
      font-size: 9px;
      color: #aaa;
      font-weight: normal;
    }

    .roll-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dice {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 8px;
      border: 2px solid #111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: 900;
      color: #111;
      box-shadow: 0 3px 0 #999;
      cursor: pointer;
    }

    .dice.rolling {
      animation: diceShake 0.16s infinite alternate;
    }

    @keyframes diceShake {
      0% { transform: rotate(-14deg) scale(1.1); }
      100% { transform: rotate(14deg) scale(1.1); }
    }

    .main-roll-btn {
      background: #8e8fa3;
      color: #241b35;
      border: 2px solid #111;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 #4a4a58;
    }

    .main-roll-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #4a4a58;
    }

    .main-roll-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal Overlays */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .modal-card {
      background: #381f33;
      border: 3px solid #caa0e2;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      width: 85%;
      max-width: 290px;
      color: white;
    }

    .modal-card h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .modal-card p {
      font-size: 11px;
      color: #ddd;
      margin-bottom: 12px;
    }

    .option-btn {
      width: 100%;
      padding: 9px;
      margin-bottom: 6px;
      background: #caa0e2;
      color: #2b1126;
      border: 2px solid #fff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-screen">
    <!-- Header -->
    <div class="top-header">
      <div class="theme-bar">
        <button class="theme-btn active" onclick="setSkin('purple')">Purple</button>
        <button class="theme-btn" onclick="setSkin('classic')">Classic</button>
        <button class="theme-btn" onclick="setSkin('emerald')">Emerald</button>
        <button class="theme-btn" onclick="setSkin('midnight')">Midnight</button>
      </div>
      <button class="action-btn" onclick="openPlayerSelect()">New Game</button>
    </div>

    <!-- Players Ribbon -->
    <div class="players-ribbon" id="playersRibbon"></div>

    <!-- Maximized Board Container -->
    <div class="board-container">
      <canvas id="gameBoard" width="1000" height="1000"></canvas>
      <!-- Reaction Overlay -->
      <div class="reaction-badge" id="reactionBadge">
        <div class="reaction-icon" id="reactionIcon">😄</div>
        <div class="reaction-text" id="reactionText">Ladder Climb!</div>
      </div>
    </div>

    <!-- Control Area -->
    <div class="controls-panel">
      <div class="turn-text" id="turnIndicator">
        Player 1's Turn
        <span id="turnSubText">Tap roll to move</span>
      </div>
      <div class="roll-container">
        <div class="dice" id="diceElement" onclick="handleTurnRoll()">⚀</div>
        <button class="main-roll-btn" id="rollBtn" onclick="handleTurnRoll()">ROLL</button>
      </div>
    </div>

    <!-- Selection Modal -->
    <div class="modal-overlay" id="setupModal">
      <div class="modal-card">
        <h2>Snakes & Ladders</h2>
        <p>Choose player count</p>
        <button class="option-btn" onclick="startGame(1)">1 Player vs Bot 🤖</button>
        <button class="option-btn" onclick="startGame(2)">2 Players</button>
        <button class="option-btn" onclick="startGame(3)">3 Players</button>
        <button class="option-btn" onclick="startGame(4)">4 Players</button>
      </div>
    </div>

    <!-- Winner Modal -->
    <div class="modal-overlay" id="winModal" style="display: none;">
      <div class="modal-card">
        <h2 id="winnerText">🏆 Player 1 Wins!</h2>
        <p>Reached Tile 100!</p>
        <button class="option-btn" onclick="openPlayerSelect()">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    // --- Synthesized Sound Effects (Offline Web Audio API) ---
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDiceRattleSound() {
      try {
        const ctx = getAudioContext();
        const bufferSize = ctx.sampleRate * 0.04;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 800 + Math.random() * 500;
        filter.Q.value = 3;

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    function playStepSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    // Cheerful Happy Ladder Chime
    function playLadderHappySound() {
      try {
        const ctx = getAudioContext();
        const notes = [392, 523.25, 659.25, 783.99]; // G4, C5, E5, G5
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = ctx.currentTime + index * 0.12;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.25, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      } catch (e) {}
    }

    // Mischievous Laughing Snake Hiss & Chuckle
    function playSnakeSmileSound() {
      try {
        const ctx = getAudioContext();
        // Hiss sound
        const bufferSize = ctx.sampleRate * 0.25;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 3500;

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.15, ctx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start();

        // Sinister chuckle pulses (Ha-Ha-Ha)
        const chuckleFreqs = [240, 210, 180];
        chuckleFreqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const startTime = ctx.currentTime + 0.15 + idx * 0.14;
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, startTime);
          osc.frequency.exponentialRampToValueAtTime(freq - 40, startTime + 0.12);

          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.12);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.12);
        });
      } catch (e) {}
    }

    // --- Board Engine & Visuals ---
    const canvas = document.getElementById('gameBoard');
    const ctx = canvas.getContext('2d');
    const size = 1000;
    const cellSize = size / 10;
    const diceChars = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    const SKINS = {
      purple: {
        bodyBg: '#35182e', panelBg: '#1f0d1b',
        tileA: '#473166', tileB: '#8e8fa3',
        textA: '#ffffff', textB: '#241b35',
        ladderWood: '#8f5c35', ladderBorder: '#4a2c13',
        rollBtnBg: '#8e8fa3', rollBtnText: '#241b35'
      },
      classic: {
        bodyBg: '#2b5f6e', panelBg: '#1e434f',
        tileA: '#f2af69', tileB: '#fff6e5',
        textA: '#b26829', textB: '#b26829',
        ladderWood: '#9e623a', ladderBorder: '#5b2f15',
        rollBtnBg: '#59d2fe', rollBtnText: '#ffffff'
      },
      emerald: {
        bodyBg: '#133529', panelBg: '#0d241c',
        tileA: '#275d4a', tileB: '#d8eedd',
        textA: '#ffffff', textB: '#1a4334',
        ladderWood: '#7c5332', ladderBorder: '#422a16',
        rollBtnBg: '#a3d9a5', rollBtnText: '#133529'
      },
      midnight: {
        bodyBg: '#0f111c', panelBg: '#181b2b',
        tileA: '#2a2f52', tileB: '#4c5382',
        textA: '#00f0ff', textB: '#ffffff',
        ladderWood: '#494268', ladderBorder: '#1c1830',
        rollBtnBg: '#6c7ab8', rollBtnText: '#131627'
      }
    };
    let activeSkin = SKINS.purple;

    // Ladders: [start, end]
    const ladders = [
      [2, 23], [8, 34], [28, 77], [39, 44],
      [45, 66], [71, 91], [68, 89], [82, 100]
    ];

    // Snakes with expressive heads
    const snakes = [
      { head: 97, tail: 57, color: '#e84118', belly: '#fbc531', angle: -0.2, cp: [[-45, 50], [70, 130], [-60, 220]] },
      { head: 95, tail: 75, color: '#44bd32', belly: '#a3cb38', angle: 0.1, cp: [[35, 25], [-25, 65]] },
      { head: 93, tail: 73, color: '#e1b12c', belly: '#f5cd79', angle: -0.1, cp: [[-35, 35], [25, 75]] },
      { head: 89, tail: 70, color: '#00a8ff', belly: '#70a1ff', angle: 0.3, cp: [[35, 45], [-35, 85]] },
      { head: 60, tail: 19, color: '#e1b12c', belly: '#f5cd79', angle: -0.3, cp: [[-65, 70], [75, 170], [-45, 250]] },
      { head: 56, tail: 46, color: '#44bd32', belly: '#a3cb38', angle: 0.2, cp: [[35, 20], [-25, 45]] },
      { head: 49, tail: 33, color: '#e84118', belly: '#fbc531', angle: -0.1, cp: [[-35, 35], [35, 65]] },
      { head: 36, tail: 18, color: '#00cec9', belly: '#81ecec', angle: 0.2, cp: [[-45, 45], [35, 85]] },
      { head: 14, tail: 5,  color: '#9c88ff', belly: '#dcdde1', angle: -0.2, cp: [[-35, 25], [25, 45]] }
    ];

    const PLAYER_COLORS = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
    let players = [];
    let currentPlayerIndex = 0;
    let isMoving = false;
    let vsBot = false;

    function setSkin(skinKey) {
      if (!SKINS[skinKey]) return;
      activeSkin = SKINS[skinKey];
      document.documentElement.style.setProperty('--bg-color', activeSkin.bodyBg);
      document.documentElement.style.setProperty('--panel-bg', activeSkin.panelBg);
      const rollBtn = document.getElementById('rollBtn');
      rollBtn.style.background = activeSkin.rollBtnBg;
      rollBtn.style.color = activeSkin.rollBtnText;

      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === skinKey);
      });
      render();
    }

    function showReaction(icon, text, duration = 1800) {
      const badge = document.getElementById('reactionBadge');
      document.getElementById('reactionIcon').textContent = icon;
      document.getElementById('reactionText').textContent = text;
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), duration);
    }

    function openPlayerSelect() {
      document.getElementById('winModal').style.display = 'none';
      document.getElementById('setupModal').style.display = 'flex';
    }

    function startGame(count) {
      document.getElementById('setupModal').style.display = 'none';
      document.getElementById('winModal').style.display = 'none';

      vsBot = (count === 1);
      const totalPlayers = vsBot ? 2 : count;
      players = [];

      for (let i = 0; i < totalPlayers; i++) {
        players.push({
          id: i,
          name: vsBot && i === 1 ? 'Bot 🤖' : `Player ${i + 1}`,
          color: PLAYER_COLORS[i],
          pos: 1,
          isBot: vsBot && i === 1
        });
      }

      currentPlayerIndex = 0;
      updatePlayersUI();
      render();
    }

    function updatePlayersUI() {
      const ribbon = document.getElementById('playersRibbon');
      ribbon.innerHTML = '';

      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === currentPlayerIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="player-dot" style="background: ${p.color}"></div>
          <span>${p.name} (T:${p.pos})</span>
        `;
        ribbon.appendChild(card);
      });

      const current = players[currentPlayerIndex];
      document.getElementById('turnIndicator').innerHTML = `
        ${current.name}'s Turn
        <span>${current.isBot ? 'Thinking...' : 'Tap roll to move'}</span>
      `;
    }

    function getCellCoords(num) {
      const clamped = Math.max(1, Math.min(100, num));
      const idx = clamped - 1;
      const rowFromBottom = Math.floor(idx / 10);
      const col = idx % 10;
      const actualCol = (rowFromBottom % 2 === 0) ? col : (9 - col);
      const actualRow = 9 - rowFromBottom;
      return {
        x: actualCol * cellSize + cellSize / 2,
        y: actualRow * cellSize + cellSize / 2
      };
    }

    // High-visibility, large text grid
    function drawGrid() {
      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const isA = (r + c) % 2 === 0;
          ctx.fillStyle = isA ? activeSkin.tileA : activeSkin.tileB;
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);

          const rowFromBottom = 9 - r;
          const num = (rowFromBottom % 2 === 0)
            ? (rowFromBottom * 10 + c + 1)
            : (rowFromBottom * 10 + (9 - c) + 1);

          ctx.font = '900 28px Arial Rounded MT Bold, sans-serif';
          ctx.fillStyle = isA ? activeSkin.textA : activeSkin.textB;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          ctx.fillText(num, (c + 1) * cellSize - 7, r * cellSize + 7);
        }
      }
    }

    function drawLadders() {
      ladders.forEach(([start, end]) => {
        const p1 = getCellCoords(start);
        const p2 = getCellCoords(end);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const angle = Math.atan2(dy, dx);
        const len = Math.hypot(dx, dy);

        ctx.save();
        ctx.translate(p1.x, p1.y);
        ctx.rotate(angle);

        ctx.strokeStyle = activeSkin.ladderBorder;
        ctx.fillStyle = activeSkin.ladderWood;
        ctx.lineWidth = 4;

        ctx.fillRect(0, -16, len, 8);
        ctx.strokeRect(0, -16, len, 8);
        ctx.fillRect(0, 8, len, 8);
        ctx.strokeRect(0, 8, len, 8);

        const steps = Math.max(3, Math.floor(len / 26));
        for (let i = 1; i < steps; i++) {
          const x = (len / steps) * i;
          ctx.fillRect(x - 4, -16, 8, 32);
          ctx.strokeRect(x - 4, -16, 8, 32);
        }
        ctx.restore();
      });
    }

    // Clear, bold cartoon snakes with expressive eyes and fangs
    function drawSnakes() {
      snakes.forEach(s => {
        const head = getCellCoords(s.head);
        const tail = getCellCoords(s.tail);

        const points = [head];
        const segs = s.cp.length + 1;
        s.cp.forEach((offset, i) => {
          const t = (i + 1) / segs;
          points.push({
            x: head.x + (tail.x - head.x) * t + offset[0],
            y: head.y + (tail.y - head.y) * t + offset[1]
          });
        });
        points.push(tail);

        // Body Shadow
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.lineTo(tail.x, tail.y);
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 26;
        ctx.lineCap = 'round';
        ctx.stroke();

        // Outer Dark Stroke
        ctx.strokeStyle = '#050505';
        ctx.lineWidth = 22;
        ctx.stroke();

        // Main Spine Color
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 16;
        ctx.stroke();

        // Belly Pattern
        ctx.strokeStyle = s.belly;
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.restore();

        // Distinct Cartoon Snake Head
        ctx.save();
        ctx.translate(head.x, head.y);
        ctx.rotate(s.angle || 0);

        // Forked Tongue
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.lineTo(0, -22);
        ctx.lineTo(-6, -28);
        ctx.moveTo(0, -22);
        ctx.lineTo(6, -28);
        ctx.stroke();

        // Head Base
        ctx.fillStyle = s.color;
        ctx.strokeStyle = '#050505';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(0, 0, 20, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Cheek Smile Arc
        ctx.strokeStyle = '#050505';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 4, 10, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();

        // Tiny fangs
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-5, 6);
        ctx.lineTo(-3, 11);
        ctx.lineTo(-1, 6);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(1, 6);
        ctx.lineTo(3, 11);
        ctx.lineTo(5, 6);
        ctx.fill();

        // Big Expressive Cartoon Eyes
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#050505';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(-7, -4, 7, 0, Math.PI * 2);
        ctx.arc(7, -4, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Pupils looking down/mischievous
        ctx.fillStyle = '#050505';
        ctx.beginPath();
        ctx.arc(-6, -3, 3.5, 0, Math.PI * 2);
        ctx.arc(6, -3, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Eye glint
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-7, -5, 1.5, 0, Math.PI * 2);
        ctx.arc(5, -5, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });
    }

    function drawPawns() {
      const tileOccupants = {};
      players.forEach(p => {
        if (!tileOccupants[p.pos]) tileOccupants[p.pos] = [];
        tileOccupants[p.pos].push(p);
      });

      Object.keys(tileOccupants).forEach(tile => {
        const group = tileOccupants[tile];
        const center = getCellCoords(Number(tile));

        group.forEach((p, idx) => {
          const total = group.length;
          const angle = (idx / total) * Math.PI * 2;
          const radius = total > 1 ? 18 : 0;
          const x = center.x + Math.cos(angle) * radius;
          const y = center.y + Math.sin(angle) * radius;

          ctx.save();
          ctx.translate(x, y);

          // Shadow
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.beginPath();
          ctx.ellipse(0, 12, 16, 7, 0, 0, Math.PI * 2);
          ctx.fill();

          // Body
          ctx.fillStyle = p.color;
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(-13, 12);
          ctx.lineTo(-6, -6);
          ctx.lineTo(6, -6);
          ctx.lineTo(13, 12);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Head
          ctx.beginPath();
          ctx.arc(0, -11, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // Highlight
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(3, -14, 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        });
      });
    }

    function render() {
      ctx.clearRect(0, 0, size, size);
      drawGrid();
      drawLadders();
      drawSnakes();
      drawPawns();
    }

    // --- Turn & Slow-Paced Step-by-Step Logic ---
    async function handleTurnRoll() {
      if (isMoving || players.length === 0) return;
      const current = players[currentPlayerIndex];

      isMoving = true;
      document.getElementById('rollBtn').disabled = true;

      const diceElem = document.getElementById('diceElement');
      diceElem.classList.add('rolling');

      // Slower, dramatic dice roll animation
      let roll = 1;
      for (let i = 0; i < 9; i++) {
        roll = Math.floor(Math.random() * 6) + 1;
        diceElem.textContent = diceChars[roll];
        playDiceRattleSound();
        await new Promise(r => setTimeout(r, 110)); // Slower dice tick
      }
      diceElem.classList.remove('rolling');
      await new Promise(r => setTimeout(r, 200));

      // Slower, satisfying tile-by-tile piece walking
      const targetPos = Math.min(100, current.pos + roll);
      while (current.pos < targetPos) {
        current.pos++;
        playStepSound();
        render();
        updatePlayersUI();
        await new Promise(r => setTimeout(r, 340)); // Deliberate step delay
      }

      await new Promise(r => setTimeout(r, 250));

      // Check Ladder
      for (const [start, end] of ladders) {
        if (current.pos === start) {
          showReaction('😄✨', `${current.name} Climbed Ladder!`);
          playLadderHappySound();
          await new Promise(r => setTimeout(r, 600));
          current.pos = end;
          render();
          updatePlayersUI();
          await new Promise(r => setTimeout(r, 800));
          break;
        }
      }

      // Check Snake Bite
      for (const s of snakes) {
        if (current.pos === s.head) {
          showReaction('🐍😈', `Snake Bit ${current.name}!`);
          playSnakeSmileSound();
          await new Promise(r => setTimeout(r, 600));
          current.pos = s.tail;
          render();
          updatePlayersUI();
          await new Promise(r => setTimeout(r, 800));
          break;
        }
      }

      // Check Winner
      if (current.pos === 100) {
        document.getElementById('winnerText').textContent = `🏆 ${current.name} Wins!`;
        document.getElementById('winModal').style.display = 'flex';
        playLadderHappySound();
        isMoving = false;
        return;
      }

      // Next Player
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updatePlayersUI();
      isMoving = false;
      document.getElementById('rollBtn').disabled = false;

      // Bot Turn
      if (players[currentPlayerIndex].isBot) {
        setTimeout(handleTurnRoll, 1100); // Relaxed bot reaction time
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setSkin('purple');
      openPlayerSelect();
    });
  </script>
</body>
