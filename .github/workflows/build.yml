name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Assets and Capacitor Project
        run: |
          # Create web directory and copy all frontend assets
          mkdir -p www
          cp -f index.html www/ || true
          cp -rf *.js *.css assets images style www/ 2>/dev/null || true

          # Initialize clean npm environment
          npm init -y
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

          # Generate Capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          # Generate Android native wrapper
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
