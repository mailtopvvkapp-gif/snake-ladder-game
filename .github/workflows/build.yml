name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Assets & Web Directory
        run: |
          mkdir -p www
          
          # Find and copy index.html (checks root or any subfolder)
          if [ -f index.html ]; then
            cp -f index.html www/
          else
            FOUND_HTML=$(find . -maxdepth 3 -name "index.html" -not -path "*/www/*" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$FOUND_HTML" ]; then
              cp -f "$FOUND_HTML" www/index.html
            else
              echo "Creating fallback index.html..."
              echo "<h1>Snakes and Ladders</h1>" > www/index.html
            fi
          fi

          # Copy remaining styles, scripts, and asset folders if present
          cp -rf assets images style styles *.js *.css www/ 2>/dev/null || true

      - name: Initialize Capacitor & Android Project
        run: |
          # Create clean package.json
          cat << 'EOF' > package.json
          {
            "name": "snakes-and-ladders",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          npm install --no-audit --no-fund

          # Generate capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          # Initialize Android platform
          npx cap add android
          npx cap sync android

          # Link Android SDK path for Gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          
