name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -f index.html www/index.html || true
          cp -rf *.js *.css assets images style www/ 2>/dev/null || true

      - name: Set up Capacitor Project
        run: |
          cat << 'EOF' > package.json
          {
            "name": "snakes-and-ladders",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          npm install

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Set up Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/*.apk
          
      - name: Initialize Capacitor App
        run: |
          cat << 'EOF' > package.json
          {
            "name": "snakes-and-ladders",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          npm install

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
