name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Web Bundle & Initialize Capacitor
        run: |
          # 1. Setup web directory
          mkdir -p www
          cp -f index.html www/index.html || true
          cp -rf assets images style *.js *.css www/ 2>/dev/null || true

          # 2. Configure package manifest
          cat << 'EOF' > package.json
          {
            "name": "snakes-and-ladders",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF

          # 3. Install dependencies without interactive prompts
          npm install --no-audit --no-fund

          # 4. Generate Capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # 5. Add Android native platform and sync assets
          npx cap add android
          npx cap sync android

          # 6. Configure local SDK path for Gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
      - name: Set up Capacitor Project
        run: |
          cat << 'EOF' > package.json
          {
            "name": "snakes-and-ladders",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          npm install

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Set up Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/*.apk
          
      - name: Initialize Capacitor App
        run: |
          cat << 'EOF' > package.json
          {
            "name": "snakes-and-ladders",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          npm install

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
