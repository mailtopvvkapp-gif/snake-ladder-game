name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Web Files and Capacitor
        run: |
          mkdir -p www
          cp -f index.html www/ || true
          cp -rf *.js *.css assets images style www/ 2>/dev/null || true

          # Initialize npm project if not already present
          if [ ! -f package.json ]; then
            npm init -y
          fi

          # Install Capacitor dependencies locally
          npm install --save-dev @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest

          # Create capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.game.snakesladders",
            "appName": "SnakesAndLadders",
            "webDir": "www"
          }
          EOF

          # Add and sync android
          npx cap add android
          npx cap sync android

          # Accept Android licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snakes-and-Ladders-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
