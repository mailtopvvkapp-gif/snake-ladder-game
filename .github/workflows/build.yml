name: Check and Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          test -f index.html || echo "Note: index.html not found in root directory"
          
